<!DOCTYPE html>
<!--
  Machines, standalone — the same /ui/index.js the console mounts, on an
  ojee-ui3 page of its own. No auth: tailnet-only, like every module.
  Screen / Shell / Files need ojee-remote beside it, which only the console
  provides, so standalone shows the machines and their services.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<title>Machines</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ojee-ui3.css">
<style>
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--fg)}
  .sa-top{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)}
  .sa-top .wm{margin-right:auto}
  #view{min-height:calc(100dvh - 53px)}
  #toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px;width:min(380px,calc(100% - 32px))}
</style>
</head>
<body class="ui3-root">
<header class="sa-top"><span class="wm">ojee<b>.</b><span>machines</span></span>
  <button class="ib" id="theme" aria-label="Toggle theme"><svg class="i l" aria-hidden="true"><use href="#i-contrast"/></svg></button></header>
<main class="main" id="main"><div id="view"></div></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module">
import { ensureSprite } from './ojee-ui3.js';
import { ModuleHost, onRoute } from './chrome.js';

const root = document.documentElement;
try { const t = localStorage.getItem('fl-theme'); if (t) root.dataset.theme = t; } catch { /* private mode */ }
document.getElementById('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('fl-theme', root.dataset.theme); } catch { /* private mode */ }
};

await ensureSprite('icons3.svg');
const manifest = await (await fetch('module.json')).json();
const host = new ModuleHost({ el: document.getElementById('view'), base: '' });
let mounted = false;
onRoute(async ({ a }) => {
  if (!mounted) { mounted = true; await host.mount(manifest, a || 'machines', `/ui/index.js?v=${manifest.version}`); }
  else host.setView(a || 'machines');
});
</script>
</body>
</html>
